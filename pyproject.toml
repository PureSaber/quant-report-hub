[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-report-hub"
version = "0.5.0"
description = "Unified visualization and exact cross-asset attribution hub for quant research outputs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "PyYAML==6.0.3",
    "openpyxl==3.1.5",
    "pyarrow==25.0.1",
    # Reviewed empty-Parquet validation fix, also pinned in requirements.lock.
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@a923a791315312a4d9caecf3b9776f08d53bb736",
]

[project.optional-dependencies]
financial-data = ["quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@ba136c2fa2eea121bfb2ad7887b536c3952586f7"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.8"]

[project.scripts]
quant-report = "quant_report_hub.cli:main"
spread-viz = "quant_report_hub.cli:main"
quant-research-evidence = "quant_report_hub.research_evidence:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_report_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=quant_report_hub --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.quant-workspace]
layer = "reporting"
schemas = [
    # Immutable input contracts validated by quant-lab before any report read.
    { id = "standard/v2", version = "2.0.0" },
    { id = "puresaber.run-manifest", version = "2.0.0" },
    { id = "quant.decision/v1", version = "1.0.0" },
    # Separately published attribution/reconciliation report manifest.
    { id = "quant-report-hub.attribution-report", version = "2.0" },
    { id = "quant-report-hub.cash-ledger-attribution", version = "1.0" },
    { id = "quant-report-hub.paired-comparison", version = "1.0" },
]
lock-files = ["requirements.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"
