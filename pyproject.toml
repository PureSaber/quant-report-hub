[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-report-hub"
version = "0.4.0"
description = "Unified visualization and exact cross-asset attribution hub for quant research outputs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@v0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9.0"]

[project.scripts]
quant-report = "quant_report_hub.cli:main"
spread-viz = "quant_report_hub.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_report_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=quant_report_hub --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
