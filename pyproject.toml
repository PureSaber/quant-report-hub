[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-report-hub"
version = "0.5.0"
description = "Unified visualization and exact cross-asset attribution hub for quant research outputs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "PyYAML==6.0.3",
    "openpyxl==3.1.5",
    "pyarrow==25.0.1",
    # Reviewed native-ledger and isolated cash/trend interventions; pinned in the lock.
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@4c48f8a678c8d29a7dc46294c99f0e668cd6c52b",
]

[project.optional-dependencies]
financial-data = ["quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@ad3440700b226497c40093197f1df4321b49d1e8"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.2"]

[project.scripts]
quant-report = "quant_report_hub.cli:main"
spread-viz = "quant_report_hub.cli:main"
quant-research-evidence = "quant_report_hub.research_evidence:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_report_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=quant_report_hub --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.quant-workspace]
layer = "reporting"
schemas = [
    # Immutable input contracts validated by quant-lab before any report read.
    { id = "standard/v2", version = "2.0.0" },
    { id = "puresaber.run-manifest", version = "2.0.0" },
    { id = "quant.decision/v1", version = "1.0.0" },
    # Separately published attribution/reconciliation report manifest.
    { id = "quant-report-hub.attribution-report", version = "2.0" },
    { id = "quant-report-hub.cash-ledger-attribution", version = "1.0" },
    { id = "quant-report-hub.execution-references", version = "1.0" },
    { id = "quant-report-hub.cash-price-bridge", version = "1.0" },
    { id = "quant-report-hub.paired-comparison", version = "1.0" },
]
lock-files = ["requirements.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"
