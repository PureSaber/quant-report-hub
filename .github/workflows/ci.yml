name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the locked environment
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: ruff check quant_report_hub tests scripts

      - name: Ruff format check
        run: ruff format --check quant_report_hub tests scripts

      - name: Complete test suite and coverage gates
        run: |
          pytest -q --cov-report=json:coverage.json
          python scripts/check_coverage.py coverage.json
