name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check quant_report_hub tests

      - name: Pytest
        run: pytest -q --cov-report=json:coverage.json

      - name: Attribution branch coverage
        shell: bash
        run: |
          python - <<'PY'
          import json

          report = json.load(open("coverage.json", encoding="utf-8"))
          path = next(
              key
              for key in report["files"]
              if key.replace(chr(92), "/").endswith("quant_report_hub/attribution.py")
          )
          summary = report["files"][path]["summary"]
          covered = summary["covered_branches"]
          total = summary["num_branches"]
          ratio = covered / total if total else 1.0
          print(f"attribution.py pure branch coverage: {covered}/{total} = {ratio:.2%}")
          if ratio < 0.90:
              raise SystemExit("attribution.py pure branch coverage must be >= 90%")
          PY
