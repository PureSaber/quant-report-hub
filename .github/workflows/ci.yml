name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the locked environment
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: ruff check quant_report_hub tests scripts

      - name: Ruff format check
        run: ruff format --check quant_report_hub tests scripts

      - name: Complete test suite and coverage gates
        run: |
          pytest -q --cov-report=json:coverage.json
          python scripts/check_coverage.py coverage.json
